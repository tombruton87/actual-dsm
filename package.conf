# Actual Budget on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=actual
PKG_TITLE="Actual Budget"
PKG_DESC="Actual Budget, private envelope budgeting that syncs between your devices, in Container Manager — with your budgets kept on your Synology, and a DSM window for the server password (shown once), signing every device out, a warning when your devices stop syncing, HTTPS with DSM's certificate (Actual needs HTTPS), backups and updates."
APP_ID="ActualBudget.AppInstance"
REPO=tombruton87/actual-dsm
SERVICES="server"
VOLUMES="data"
IMAGE_VARS="AB_IMAGE"
PORT=5006
PORTS="5006 5007 5016 8106"
HEALTH_PATH=/health
APP_ACTIONS="newpw|signout|stale|limit|refreshcert"
APP_ANSWER_KEYS="TLS"
APP_REQUEST_KEYS="SIGNOUT STALE_DAYS LIMIT_MB TLS"
TAGLINE="budgeting"
WELCOME="Actual Budget is private, fast envelope budgeting — every pound has a job. Your budgets live on your Synology and sync between the browsers and phones you use them on. This package runs Actual's server in Container Manager over HTTPS (Actual needs it), sets its password, and adds a window to DSM for your budgets, devices and backups."
BACKUP_WHAT="every budget on the server and the server's account (password, signed-in devices) — consistent copies of Actual's SQLite files."
SITE_NOTE="The address you open Actual at. Actual works only over HTTPS (browsers keep the features it needs for secure pages), so the package serves it with DSM's own certificate (Control Panel → Security → Certificate, the system default; renewals are picked up daily) or a self-signed one. Plain HTTP is only for DSM's reverse proxy, which then provides the HTTPS."
ICON_TOP="#6d4bd6"
ICON_BOTTOM="#5236b8"
ICON_LETTER="A"   # only if icon.png is missing
BETA=yes
