# Actual Budget, as the Synology package runs it: the compose project in the
# actual shared folder. The setup container writes .env beside this. Budgets
# and the server's account live in the actual_data volume (with the HTTPS
# certificate under tls/); backups go to the share.
services:
  server:
    image: ${AB_IMAGE:-actualbudget/actual-server:latest}
    container_name: actual-server
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-5006}:5006"
    volumes:
      - data:/data
    environment:
      TZ: ${TZ:-UTC}
      # Actual needs HTTPS in the browser: served here with DSM's certificate or a self-signed one (empty: plain HTTP behind DSM's reverse proxy).
      ACTUAL_HTTPS_CERT: ${TLS_CERT:-}
      ACTUAL_HTTPS_KEY: ${TLS_KEY:-}
      # The biggest budget file a device may upload (MB), set in the window.
      ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB: ${LIMIT_MB:-20}
      ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB: ${LIMIT_MB:-20}
      ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB: ${LIMIT_MB:-20}
    healthcheck:
      # Actual's own check; a self-signed certificate is fine for talking to itself.
      test: ["CMD-SHELL", "NODE_TLS_REJECT_UNAUTHORIZED=0 node /app/scripts/health-check.js 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  data:
